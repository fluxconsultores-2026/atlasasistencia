<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Asistencia Atlas TTT</title>
<style>
:root{
  --atlas-blue:#46B7D5; --atlas-green:#47D698; --ink:#1D1D1F; --ink2:#6E6E73; --ink3:#AEAEB2;
  --line:#E5E5EA; --soft:#F4F4F4; --bg:#FFFFFF; --miss:#FF6B6B; --miss-soft:#FFF0F0;
  --blue-soft:#E8F6FA; --green-soft:#E6F9F0; --radius:20px;
  color-scheme: light;
}
*{box-sizing:border-box;margin:0;padding:0}
html{background:var(--bg)}
body{background:var(--bg);color:var(--ink);font:15px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
.wrap{max-width:1180px;margin:0 auto;padding:28px 24px 64px}
header{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;padding-bottom:22px}
header img{height:46px;width:auto}
.eyebrow{font-size:13px;font-weight:600;color:var(--atlas-blue);letter-spacing:.02em;text-transform:uppercase}
h1{font:700 34px/1.1 -apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue",sans-serif;letter-spacing:-.022em;margin-top:6px}
.sub{color:var(--ink2);margin-top:6px}
.hero{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;flex-wrap:wrap;margin:8px 0 26px}
.seg{display:inline-flex;background:var(--soft);border-radius:12px;padding:3px;gap:2px;overflow-x:auto;max-width:100%}
.seg button{border:0;background:transparent;font:inherit;font-size:14px;font-weight:500;color:var(--ink);padding:8px 16px;border-radius:9px;cursor:pointer;white-space:nowrap;transition:background .2s,box-shadow .2s}
.seg button[aria-pressed=true]{background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.12),0 1px 1px rgba(0,0,0,.04);font-weight:600}
.grid{display:grid;gap:16px}
.kpis{grid-template-columns:repeat(4,1fr)}
.card{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:22px}
.kpi .lbl{font-size:13px;color:var(--ink2);font-weight:500}
.kpi .val{font:700 40px/1.1 -apple-system,"SF Pro Display","Helvetica Neue",sans-serif;letter-spacing:-.02em;margin-top:8px;font-variant-numeric:tabular-nums}
.kpi .val small{font-size:18px;color:var(--ink3);font-weight:600}
.kpi .foot{font-size:13px;color:var(--ink2);margin-top:4px}
.kpi.accent{background:linear-gradient(135deg,var(--atlas-blue),var(--atlas-green));border:0;color:#fff}
.kpi.accent .lbl,.kpi.accent .foot,.kpi.accent .val small{color:rgba(255,255,255,.85)}
.two{grid-template-columns:1.35fr 1fr;margin-top:16px}
h2{font:600 19px/1.25 -apple-system,"SF Pro Display","Helvetica Neue",sans-serif;letter-spacing:-.01em}
.card .hint{font-size:13px;color:var(--ink2);margin-top:2px}
.bars{margin-top:20px;display:flex;flex-direction:column;gap:16px}
.bar-row .top{display:flex;justify-content:space-between;font-size:14px;margin-bottom:7px}
.bar-row .top b{font-weight:600}
.bar-row .top span{color:var(--ink2);font-variant-numeric:tabular-nums}
.track{height:12px;border-radius:99px;background:var(--soft);overflow:hidden}
.fill{height:100%;border-radius:99px;background:linear-gradient(90deg,var(--atlas-blue),var(--atlas-green));width:0;transition:width .7s cubic-bezier(.2,.8,.2,1)}
.pending .top b{color:var(--ink3)} .pending .track{background:repeating-linear-gradient(45deg,var(--soft) 0 6px,#fff 6px 12px)}
.ringbox{display:flex;align-items:center;gap:22px;margin-top:18px;flex-wrap:wrap}
.legend{display:flex;flex-direction:column;gap:10px;font-size:14px}
.legend div{display:flex;align-items:center;gap:10px}
.dot{width:10px;height:10px;border-radius:50%;flex:none}
.legend b{font-variant-numeric:tabular-nums;margin-left:auto;padding-left:16px}
.ctry{margin-top:16px}
.ctry-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-top:16px}
.chip-c{background:var(--soft);border-radius:14px;padding:12px 14px}
.chip-c .k{font-size:12px;color:var(--ink2);font-weight:600}
.chip-c .v{font-size:20px;font-weight:700;margin-top:2px;font-variant-numeric:tabular-nums}
.chip-c .mini{height:5px;border-radius:9px;background:#fff;margin-top:8px;overflow:hidden}
.chip-c .mini i{display:block;height:100%;background:var(--atlas-green)}
.tablecard{margin-top:16px;padding:0;overflow:hidden}
.tb-head{padding:22px 22px 14px;display:flex;justify-content:space-between;align-items:flex-end;gap:14px;flex-wrap:wrap}
.tools{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.search{display:flex;align-items:center;gap:8px;background:var(--soft);border-radius:10px;padding:8px 12px;min-width:220px}
.search input{border:0;background:transparent;font:inherit;outline:none;width:100%;color:var(--ink)}
.filters{display:flex;gap:6px;flex-wrap:wrap;padding:0 22px 14px}
.pill{border:1px solid var(--line);background:#fff;border-radius:99px;padding:6px 13px;font:inherit;font-size:13px;font-weight:500;cursor:pointer;color:var(--ink)}
.pill[aria-pressed=true]{background:var(--ink);color:#fff;border-color:var(--ink)}
.toggle{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink2);cursor:pointer;user-select:none}
.switch{width:38px;height:23px;border-radius:99px;background:#E9E9EA;position:relative;transition:background .2s;flex:none}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:19px;height:19px;border-radius:50%;background:#fff;box-shadow:0 2px 4px rgba(0,0,0,.2);transition:transform .2s}
.toggle input{display:none}
.toggle input:checked+.switch{background:var(--atlas-green)}
.toggle input:checked+.switch::after{transform:translateX(15px)}
.tscroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-size:12px;font-weight:600;color:var(--ink2);padding:10px 14px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);background:#FAFAFA;white-space:nowrap;cursor:pointer}
th.c,td.c{text-align:center}
td{padding:11px 14px;border-bottom:1px solid #F0F0F2;vertical-align:middle}
tr:last-child td{border-bottom:0}
tbody tr:hover{background:#FAFCFD}
.nm{font-weight:500}
.em{color:var(--ink2);font-size:12.5px}
.role{font-size:12px;color:var(--ink2);white-space:nowrap}
.st{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:50%;font-size:13px;font-weight:700}
.st.y{background:var(--green-soft);color:#16A06A}
.st.n{background:var(--miss-soft);color:#E5484D}
.st.p{background:var(--soft);color:var(--ink3);font-weight:500}
.st.warn{box-shadow:0 0 0 2px #FFD60A inset}
.badge{display:inline-block;font-size:12px;font-weight:600;border-radius:99px;padding:3px 10px;white-space:nowrap}
.b-ok{background:var(--green-soft);color:#138A5B}
.b-part{background:var(--blue-soft);color:#1D87A6}
.b-none{background:var(--miss-soft);color:#D93C41}
.b-team{background:var(--soft);color:var(--ink2)}
.empty{padding:40px;text-align:center;color:var(--ink2)}
.ov{grid-template-columns:repeat(auto-fill,minmax(200px,1fr));margin-top:16px}
.ovc{cursor:pointer;transition:transform .15s,box-shadow .15s}
.ovc:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(0,0,0,.06)}
.ovc .code{font-size:13px;font-weight:700;color:var(--atlas-blue)}
.ovc .nmod{font-size:15px;font-weight:600;margin-top:2px}
.ovc .big{font:700 32px/1 -apple-system,"SF Pro Display",sans-serif;margin-top:14px;font-variant-numeric:tabular-nums}
.ovc .meta{font-size:13px;color:var(--ink2);margin-top:6px}
.ovc .track{margin-top:12px;height:8px}
footer{margin-top:28px;font-size:12px;color:var(--ink3);text-align:center}
.tip{position:fixed;pointer-events:none;background:rgba(29,29,31,.92);color:#fff;font-size:12px;padding:7px 10px;border-radius:8px;max-width:260px;opacity:0;transition:opacity .12s;z-index:9}
@media (max-width:860px){.kpis{grid-template-columns:repeat(2,1fr)}.two{grid-template-columns:1fr}h1{font-size:28px}}
@media (max-width:520px){header .sub{text-align:left!important}.bar-row .top{flex-direction:column;gap:2px}.wrap{padding:20px 16px 48px}.kpi .val{font-size:32px}.search{min-width:0;flex:1}header img{height:36px}}
@media (prefers-reduced-motion:reduce){.fill,.ovc,.seg button{transition:none}}
</style>
</head>

const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pct=(a,b)=>b?Math.round(a*100/b):0;
const KU=m=>m.people.filter(p=>p.r==='Key User');
const doneIdx=m=>m.sessions.map((s,i)=>s.done?i:-1).filter(i=>i>=0);
function status(p,m){const d=doneIdx(m);if(!d.length)return'pend';const n=d.filter(i=>p.a[i]===1).length;return n===d.length?'ok':n===0?'none':'part'}
function stats(m){const ku=KU(m),d=doneIdx(m);const per=m.sessions.map((s,i)=>({...s,att:s.done?ku.filter(p=>p.a[i]===1).length:null}));
  const exp=ku.length*d.length,got=d.reduce((t,i)=>t+per[i].att,0);
  const st={ok:0,part:0,none:0};ku.forEach(p=>{const s=status(p,m);if(st[s]!=null)st[s]++});
  return{ku:ku.length,per,exp,got,pct:pct(got,exp),st,done:d.length,total:m.sessions.length}}
let cur='ALL',flt='all',q='',team=false,sort={k:'n',d:1};
function seg(){const b=[['ALL','Resumen'],...DATA.mods.map(m=>[m.id,m.id==='FI ESPAÑA'?'FI España':m.id])];
  $('#seg').innerHTML=b.map(([id,l])=>`<button aria-pressed="${id===cur}" data-id="${esc(id)}">${esc(l)}</button>`).join('');
  $('#seg').querySelectorAll('button').forEach(x=>x.onclick=()=>go(x.dataset.id))}
function go(id){cur=id;flt='all';q='';seg();render();window.scrollTo({top:0,behavior:'smooth'})}
function ring(st,total){const R=54,C=2*Math.PI*R;let off=0;const seg=[[st.ok,'#47D698'],[st.part,'#46B7D5'],[st.none,'#FF6B6B']];
  const arcs=seg.map(([v,c])=>{const L=total?C*v/total:0;const s=`<circle r="${R}" cx="70" cy="70" fill="none" stroke="${c}" stroke-width="16" stroke-dasharray="${L} ${C-L}" stroke-dashoffset="${-off}" transform="rotate(-90 70 70)"/>`;off+=L;return s}).join('');
  return `<svg width="140" height="140" viewBox="0 0 140 140" role="img" aria-label="Distribución de Key Users"><circle r="${R}" cx="70" cy="70" fill="none" stroke="#F4F4F4" stroke-width="16"/>${arcs}<text x="70" y="68" text-anchor="middle" font-size="28" font-weight="700" fill="#1D1D1F">${pct(st.ok,total)}%</text><text x="70" y="88" text-anchor="middle" font-size="11" fill="#6E6E73">asistencia completa</text></svg>`}
function kpis(items){return `<section class="grid kpis">${items.map(k=>`<div class="card kpi ${k.c||''}"><div class="lbl">${k.l}</div><div class="val">${k.v}</div><div class="foot">${k.f}</div></div>`).join('')}</section>`}
function render(){
  const main=$('#main');
  if(cur==='ALL'){
    const all=DATA.mods.map(m=>({m,s:stats(m)}));
    const uniq=new Map();DATA.mods.forEach(m=>KU(m).forEach(p=>{const e=p.e.toLowerCase();const s=status(p,m);const o=uniq.get(e)||{any:false,all:true};o.any=o.any||s==='ok'||s==='part';o.all=o.all&&s!=='none';uniq.set(e,o)}));
    const exp=all.reduce((t,x)=>t+x.s.exp,0),got=all.reduce((t,x)=>t+x.s.got,0);
    const sessDone=all.reduce((t,x)=>t+x.s.done,0),sessTot=all.reduce((t,x)=>t+x.s.total,0);
    const never=[...uniq.values()].filter(o=>!o.any).length;
    $('#title').textContent='Resumen general';$('#subtitle').textContent=`${DATA.mods.length} módulos · ${sessDone} de ${sessTot} sesiones realizadas`;
    main.innerHTML=kpis([
      {l:'Asistencia promedio',v:`${pct(got,exp)}<small>%</small>`,f:`${got} de ${exp} asistencias esperadas`,c:'accent'},
      {l:'Key Users únicos',v:uniq.size,f:'Considerando todos los módulos'},
      {l:'Asistieron al menos 1 vez',v:uniq.size-never,f:`${pct(uniq.size-never,uniq.size)}% del total`},
      {l:'Sin asistencia',v:never,f:'No han ido a ninguna sesión'}])+
      `<section class="grid ov">${all.map(({m,s})=>`<div class="card ovc" data-id="${esc(m.id)}" tabindex="0" role="button"><div class="code">${esc(m.id==='FI ESPAÑA'?'FI España':m.id)}</div><div class="nmod">${esc(m.name)}</div><div class="big">${s.pct}%</div><div class="meta">${s.ku} Key Users · ${s.done}/${s.total} sesiones</div><div class="track"><div class="fill" style="--w:${s.pct}%"></div></div><div class="meta">${s.st.none} sin asistencia</div></div>`).join('')}</section>`+
      `<section class="card" style="margin-top:16px"><h2>Asistencia por sesión</h2><div class="hint">Asistieron y faltaron sobre los Key Users convocados</div><div class="bars">${all.flatMap(({m,s})=>s.per.map(p=>bar(`${m.id==='FI ESPAÑA'?'FI España':m.id} · ${p.label}`,p.date,p.att,s.ku,p.done))).join('')}</div></section>`;
    main.querySelectorAll('.ovc').forEach(c=>{c.onclick=()=>go(c.dataset.id);c.onkeydown=e=>{if(e.key==='Enter')go(c.dataset.id)}});
  } else {
    const m=DATA.mods.find(x=>x.id===cur),s=stats(m);
    $('#title').textContent=`${m.id==='FI ESPAÑA'?'FI España':m.id} · ${m.name}`;$('#subtitle').textContent=`${s.total} sesiones · ${m.horario} · ${s.done} realizadas`;
    const cty={};KU(m).forEach(p=>{const k=p.p||'—';cty[k]=cty[k]||{t:0,ok:0};cty[k].t++;if(status(p,m)!=='none')cty[k].ok++});
    main.innerHTML=kpis([
      {l:'Asistencia del módulo',v:`${s.pct}<small>%</small>`,f:`${s.got} de ${s.exp} asistencias esperadas`,c:'accent'},
      {l:'Convocados por sesión',v:s.ku,f:`Key Users del módulo`},
      {l:'Asistencia completa',v:s.st.ok,f:`Fueron a todas las sesiones realizadas`},
      {l:'Sin asistencia',v:s.st.none,f:`No han ido a ninguna sesión`}])+
      `<section class="grid two"><div class="card"><h2>Asistencia por sesión</h2><div class="hint">${s.ku} Key Users convocados por sesión</div><div class="bars">${s.per.map(p=>bar(p.label,p.date,p.att,s.ku,p.done)).join('')}</div></div>
      <div class="card"><h2>Cumplimiento</h2><div class="hint">Sobre las sesiones ya realizadas</div><div class="ringbox">${ring(s.st,s.ku)}<div class="legend">
      <div><span class="dot" style="background:#47D698"></span>Completa<b>${s.st.ok}</b></div><div><span class="dot" style="background:#46B7D5"></span>Parcial<b>${s.st.part}</b></div><div><span class="dot" style="background:#FF6B6B"></span>Ninguna<b>${s.st.none}</b></div></div></div></div></section>`+
      `<section class="card ctry"><h2>Por país / área</h2><div class="hint">Key Users con al menos una asistencia</div><div class="ctry-grid">${Object.entries(cty).sort((a,b)=>b[1].t-a[1].t).map(([k,v])=>`<div class="chip-c"><div class="k">${esc(k)}</div><div class="v">${v.ok}<span style="color:#AEAEB2;font-size:14px"> / ${v.t}</span></div><div class="mini"><i style="width:${pct(v.ok,v.t)}%"></i></div></div>`).join('')}</div></section>`+
      table(m,s);
    bindTable(m);
  }
  requestAnimationFrame(()=>main.querySelectorAll('.fill').forEach(f=>f.style.width=f.style.getPropertyValue('--w')));
}
function bar(l,d,a,t,done){return done?`<div class="bar-row"><div class="top"><b>${esc(l)} <span style="font-weight:400">· ${esc(d)}</span></b><span><b style="color:#138A5B">${a} asistieron</b> · <b style="color:#D93C41">${t-a} faltaron</b> · ${pct(a,t)}%</span></div><div class="track"><div class="fill" style="--w:${pct(a,t)}%"></div></div></div>`
  :`<div class="bar-row pending"><div class="top"><b>${esc(l)} <span style="font-weight:400">· ${esc(d)}</span></b><span>Pendiente</span></div><div class="track"></div></div>`}
function table(m,s){const f=[['all','Todos'],...m.sessions.map((x,i)=>x.done?[`f${i}`,`Faltaron ${x.label}`]:null).filter(Boolean),['none','Sin asistencia'],['part','Parcial'],['ok','Completa']];
  return `<section class="card tablecard"><div class="tb-head"><div><h2>Participantes</h2><div class="hint" id="cnt"></div></div><div class="tools">
  <label class="search"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#8E8E93" stroke-width="2.4" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input id="q" placeholder="Buscar nombre o correo" value="${esc(q)}"></label>
  </div></div>
  <div class="filters">${f.map(([k,l])=>`<button class="pill" data-f="${k}" aria-pressed="${flt===k}">${l}</button>`).join('')}</div>
  <div class="tscroll"><table><thead><tr><th data-k="n">Nombre</th>${m.sessions.map((x,i)=>`<th class="c" data-k="s${i}">${esc(x.label)}<br><span style="font-weight:400">${esc(x.date)}</span></th>`).join('')}<th data-k="st">Estado</th></tr></thead><tbody id="tb"></tbody></table></div></section>`}
function bindTable(m){
  const draw=()=>{const ord={ok:0,part:1,none:2,pend:3,team:4};
    let rows=m.people.map(p=>({...p,st:status(p,m)}));
    if(flt[0]==='f'){const i=+flt.slice(1);rows=rows.filter(p=>p.a[i]===0)}else if(flt!=='all')rows=rows.filter(p=>p.st===flt);
    if(q){const t=q.toLowerCase();rows=rows.filter(p=>p.n.toLowerCase().includes(t)||p.e.toLowerCase().includes(t))}
    rows.sort((a,b)=>{const k=sort.k;let x,y;if(k==='st'){x=ord[a.st];y=ord[b.st]}else if(k[0]==='s'&&k!=='st'){const i=+k.slice(1);x=a.a[i]??-1;y=b.a[i]??-1}else{x=a[k].toLowerCase();y=b[k].toLowerCase()}return(x<y?-1:x>y?1:0)*sort.d});
    const lab={ok:['Completa','b-ok'],part:['Parcial','b-part'],none:['Sin asistencia','b-none'],pend:['Pendiente','b-team'],team:['Equipo proyecto','b-team']};
    $('#tb').innerHTML=rows.length?rows.map(p=>`<tr><td><div class="nm">${esc(p.n)}</div><div class="em">${esc(p.e)}</div></td>${p.a.map((v,i)=>{const c=p.c[i];const w=c?' warn':'';const t=c?` data-tip="${esc(c.replace(/^Claude:\s*/,''))}"`:'';
      return `<td class="c">${!m.sessions[i].done?'<span class="st p">–</span>':v===1?`<span class="st y${w}"${t}>✓</span>`:`<span class="st n">✕</span>`}</td>`}).join('')}<td><span class="badge ${lab[p.st][1]}">${lab[p.st][0]}</span></td></tr>`).join('')
      :`<tr><td colspan="${m.sessions.length+2}" class="empty">Sin resultados</td></tr>`;
    $('#cnt').textContent=`${rows.length} ${rows.length===1?'persona':'personas'}`;
    document.querySelectorAll('[data-tip]').forEach(e=>{e.onmouseenter=ev=>{const t=$('#tip');t.textContent=e.dataset.tip;t.style.opacity=1};e.onmousemove=ev=>{const t=$('#tip');t.style.left=Math.min(ev.clientX+12,innerWidth-270)+'px';t.style.top=ev.clientY+14+'px'};e.onmouseleave=()=>$('#tip').style.opacity=0});
  };
  $('#q').oninput=e=>{q=e.target.value;draw()};
  document.querySelectorAll('.pill').forEach(b=>b.onclick=()=>{flt=b.dataset.f;document.querySelectorAll('.pill').forEach(x=>x.setAttribute('aria-pressed',x===b));draw()});
  document.querySelectorAll('th[data-k]').forEach(th=>th.onclick=()=>{const k=th.dataset.k;sort={k,d:sort.k===k?-sort.d:1};draw()});
  draw();
}
